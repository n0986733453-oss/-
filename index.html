<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เงินสโมสร</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f9cce2;
  color: white;
  overflow-x: hidden;
  
}
/* 👉 ชั้น gradient จริง */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;

  background: radial-gradient(
    circle at top,
    #ffd6ec,
    #fce1ee 50%,
    #f3ddff 100%
  );
}
/* 👉 ชั้น noise กลบเส้น */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;

  background-image: url("https://www.transparenttextures.com/patterns/noise.png");
  opacity: 0.25;
  pointer-events: none;
}

.container {
  max-width: 500px;
  margin: auto;
  text-align: center;
  padding: 10px 12px;
}

.circle {
  width: 200px;
  height: 200px;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 40px auto;
  font-size: 24px;
  transition: 0.3s;
  box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
  border: 3px solid rgba(255,255,255,0.3);

  animation: glowPulse 2s infinite;
  transition: 0.4s;
}

.menu {
  display: flex;
  justify-content: space-around;
}

.menu-item {
  width: 80px;
  height: 80px;
   background: linear-gradient(145deg, #ff7ebf, #ff9ad5);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;

  color: white;
  font-size: 16px;
  font-weight: 500;

  border: 2px solid rgba(255,255,255,0.8); /* 👈 เพิ่มกรอบขาว */
  
  box-shadow:
    0 8px 20px rgba(255, 79, 163, 0.3), /* เงาเดิม */
    0 0 0 2px rgba(255,255,255,0.25);   /* 👈 เส้นขอบนอกเพิ่มความชัด */

  transition: 0.2s;
}
.menu-item:active {
  transform: scale(0.95);
}

/* overlay */
.overlay {
  position: fixed;
  top: 100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff5fa;
  color: #333;
  z-index: 10;
  transition: 0.4s;
  padding: 20px 16px; /* 👈 เพิ่มซ้ายขวา */
  overflow-y: auto;
}

.overlay.active {
  top: 0;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: #1e293b;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* table */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

#incomeTable tr td:last-child {
  color: #23c05a; /* ชมพูหวาน */
}

#expenseTable tr td:last-child {
  color: #ff4d6d; /* ชมพูเข้ม */
}

th {
  text-align: left;
  opacity: 0.6;
  font-weight: normal;
}

td {
  text-align: left;
}

th:last-child,
td:last-child {
  text-align: right;
  padding-right: 20px;
  font-weight: bold;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #333;
}

tr:hover {
  background: rgba(255, 192, 203, 0.15);
}

select {
  margin-left: auto;
  background: #1e293b;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
}

h2 {
  font-size: 20px;
  letter-spacing: 1px;
  animation: floatText 3s ease-in-out infinite;
  text-shadow: 0 0 10px rgba(255,255,255,0.6);
}
@keyframes floatText {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
  100% { transform: translateY(0px); }
}

/*สรุปยอด*/
.summary-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 15px;
  margin-top: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);

  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.summary-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 5px;
  font-size: 16px;
}

.summary-item span {
  font-weight: bold;
}

/* สี */
.income-color {
  color: #23c05a;
}

.expense-color {
  color: #ff4d6d;
}

.balance-color {
  color: #050202;
  font-size: 18px;
}

.content {
  max-width: 500px;
  margin: 0 auto;
  padding: 0 16px;
}

@media (min-width: 500px) {
  .content {
    padding: 0 25px;
  }
}

.summary-card:nth-of-type(2) {
  background: rgba(255, 255, 255, 0.25);
  border: 2px solid rgba(255, 182, 193, 0.4);
}
.top-income {
  color: #23c05a;
}

.top-expense {
  color: #ff4d6d;
}

/*รูป*/
.greeting-box {
  position: fixed;
  bottom: 15px;
  left: 15px;

  transform: rotate(-10deg); /* 👈 เอียง */

  display: flex;
  align-items: center;
  gap: 6px;

  z-index: 999;
  pointer-events: none; /* 👈 ไม่บังการกด */
}

.greeting-box img {
  width: 80px; /* 👈 เพิ่มขนาด (เดิม 60) */
  height: auto;

  background: white;            /* 👈 กรอบขาว */
  padding: 6px;                 /* 👈 ความหนากรอบ */
  border-radius: 20px;          /* 👈 มนๆน่ารัก */

  box-shadow: 
    0 6px 15px rgba(0,0,0,0.15),   /* เงาหลัก */
    0 0 0 3px rgba(255,255,255,0.6); /* ขอบฟุ้ง */

  transform: rotate(-5deg); /* 👈 เอียงนิดๆ */
  border: 2px dashed #ffd1e6; /* 👈 เส้นปะชมพู */
}

.greeting-box span {
  background: rgba(255,255,255,0.8);
  color: #ff4fa3;
  padding: 4px 8px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;

  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  transform: rotate(30deg); /* 👈 ข้อความเอียงกลับ */
  margin-left: -70px; /* ขยับไปขวา */
  margin-top: -70px; /* ขึ้น */
}
@media (max-width: 500px) {
  .greeting-box img {
    width: 45px;
  }

.overlay.active ~ .greeting-box {
  display: none !important;
}

  .greeting-box span {
    font-size: 12px;
    padding: 3px 6px;
  }
}

</style>
</head>

<body>

<div class="greeting-box">
  <img src="your-image.png" alt="hello">
  <span>สวัสดีค่ะพี่ปิ๋ว พี่ป๋อม</span>
</div>

<div class="container">
  <h2>ยอดเงินคงเหลือ</h2>

  <div class="circle" id="circle">
    <span id="balance">0 บาท</span>
  </div>

  <div class="menu">
    <div class="menu-item" onclick="openOverlay('income')">🟢<br>รายรับ</div>
    <div class="menu-item" onclick="openOverlay('expense')">🔴<br>รายจ่าย</div>
    <div class="menu-item" onclick="openSummary()">📊<br>สรุป</div>
  </div>
</div>

<!-- รายรับ -->
<div id="income" class="overlay">
  <div class="header">
    <button class="back-btn" onclick="closeOverlay()">←</button>
    <h2>รายรับ</h2>

    <select id="monthIncome" onchange="loadIncome()">
      <option value="all">ทั้งหมด</option>
      <option value="01">มกราคม</option>
      <option value="02">กุมภาพันธ์</option>
      <option value="03">มีนาคม</option>
      <option value="04">เมษายน</option>
      <option value="05">พฤษภาคม</option>
      <option value="06">มิถุนายน</option>
      <option value="07">กรกฎาคม</option>
      <option value="08">สิงหาคม</option>
      <option value="09">กันยายน</option>
      <option value="10">ตุลาคม</option>
      <option value="11">พฤศจิกายน</option>
      <option value="12">ธันวาคม</option>
    </select>
  </div>

<div class="content">
  <table id="incomeTable">
    <tr><th>วันที่</th><th>รายการ</th><th>เงิน</th></tr>
  </table>
</div>

<!-- รายจ่าย -->
<div id="expense" class="overlay">
  <div class="header">
    <button class="back-btn" onclick="closeOverlay()">←</button>
    <h2>รายจ่าย</h2>

    <select id="monthExpense" onchange="loadExpense()">
      <option value="all">ทั้งหมด</option>
      <option value="01">มกราคม</option>
      <option value="02">กุมภาพันธ์</option>
      <option value="03">มีนาคม</option>
      <option value="04">เมษายน</option>
      <option value="05">พฤษภาคม</option>
      <option value="06">มิถุนายน</option>
      <option value="07">กรกฎาคม</option>
      <option value="08">สิงหาคม</option>
      <option value="09">กันยายน</option>
      <option value="10">ตุลาคม</option>
      <option value="11">พฤศจิกายน</option>
      <option value="12">ธันวาคม</option>
    </select>
  </div>

<div class="content">
  <table id="expenseTable">
    <tr><th>วันที่</th><th>รายการ</th><th>เงิน</th></tr>
  </table>
</div>

<!--สรุปยอด-->
<div id="summary" class="overlay">
  <div class="header">
    <button class="back-btn" onclick="closeOverlay()">←</button>
    <h2>สรุปยอด</h2>
  </div>

  <!-- 👇 เพิ่มตรงนี้ -->
  <div class="content">

    <select id="summaryMode" onchange="renderSummary()" style="margin:10px 0;">
      <option value="current">📅 เดือนปัจจุบัน</option>
      <option value="select">📌 เลือกเดือน</option>
      <option value="all">📊 ทั้งหมด</option>
    </select>

    <select id="summaryMonth" onchange="renderSummary()" style="display:none;">
      <option value="01">มกราคม</option>
      <option value="02">กุมภาพันธ์</option>
      <option value="03">มีนาคม</option>
      <option value="04">เมษายน</option>
      <option value="05">พฤษภาคม</option>
      <option value="06">มิถุนายน</option>
      <option value="07">กรกฎาคม</option>
      <option value="08">สิงหาคม</option>
      <option value="09">กันยายน</option>
      <option value="10">ตุลาคม</option>
      <option value="11">พฤศจิกายน</option>
      <option value="12">ธันวาคม</option>
    </select>

    <p id="summaryText" style="text-align:center; font-weight:600;"></p>
    <div class="summary-item">
  <div>📊 ใช้ไป</div>
  <span id="percentExpense">0%</span>
</div>

    <div class="summary-card">
      <div class="summary-item income-color">
        <div>📥 รายรับ</div>
        <span id="sumIncome">0</span>
      </div>

      <div class="summary-item expense-color">
        <div>📤 รายจ่าย</div>
        <span id="sumExpense">0</span>
      </div>

      <hr>

      <div class="summary-item balance-color">
        <div>💰 คงเหลือ</div>
        <span id="sumBalance">0</span>
      </div>
    </div>
     
<div class="summary-card" style="margin-top:15px;">
  <div class="summary-item">
    <div>🥇 รับมากสุด</div>
    <span id="topIncome" class="top-income">-</span>
  </div>

  <div class="summary-item">
    <div>💸 จ่ายมากสุด</div>
    <span id="topExpense" class="top-expense">-</span>
  </div>
</div>
    
  </div> <!-- 👈 ปิด content -->

</div>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/1XJgUnZWO-71nJ4DGFKJUOhNAFjzkTLiC0DxXdSZmMb8/export?format=csv";

let realBalance = 0;

const incomeTable = document.getElementById("incomeTable");
const expenseTable = document.getElementById("expenseTable");

/* 🔥 คำนวณยอดจริง (ไม่สนเดือน) */
async function loadBalanceOnly() {
  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.split("\n").slice(1);

  let total = 0;

  rows.forEach(row => {
    const col = row.split(",");
    const type = (col[1] || "").trim();
    const money = Number(col[3]);

    if (!money) return;

    if (type === "income") total += money;
    if (type === "expense") total -= money;
  });

  realBalance = total;
  updateBalance(realBalance);
}

/* รายรับ (filter เดือน) */
async function loadIncome() {

  const selectedMonth = document.getElementById("monthIncome").value;

  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.split("\n").slice(1);

  incomeTable.innerHTML = "<tr><th>วันที่</th><th>รายการ</th><th>เงิน</th></tr>";

  rows.forEach(row => {
    const col = row.split(",");

    const date = (col[0] || "").trim();
    const type = (col[1] || "").trim();
    const name = (col[2] || "").trim();
    const money = Number(col[3]);

    if (type !== "income") return;

    const month = date.split("/")[1]?.padStart(2, "0");
    if (selectedMonth !== "all" && month !== selectedMonth) return;

    let r = incomeTable.insertRow();
    r.insertCell(0).innerText = date;
    r.insertCell(1).innerText = name;
    r.insertCell(2).innerText = money.toLocaleString() + " ฿";
  });

  updateBalance(realBalance);
}

/* รายจ่าย (filter เดือน) */
async function loadExpense() {

  const selectedMonth = document.getElementById("monthExpense").value;

  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.split("\n").slice(1);

  expenseTable.innerHTML = "<tr><th>วันที่</th><th>รายการ</th><th>เงิน</th></tr>";

  rows.forEach(row => {
    const col = row.split(",");

    const date = (col[0] || "").trim();
    const type = (col[1] || "").trim();
    const name = (col[2] || "").trim();
    const money = Number(col[3]);

    if (type !== "expense") return;

    const month = date.split("/")[1]?.padStart(2, "0");
    if (selectedMonth !== "all" && month !== selectedMonth) return;

    let r = expenseTable.insertRow();
    r.insertCell(0).innerText = date;
    r.insertCell(1).innerText = name;
    r.insertCell(2).innerText = "- " + money.toLocaleString() + " ฿";
  });

  updateBalance(realBalance);
}

/* UI */
function openOverlay(page) {
  document.getElementById(page).classList.add("active");
  document.querySelector(".greeting-box").style.display = "none";
  history.pushState({ page }, "", "");
}

function closeOverlay() {
  document.querySelectorAll(".overlay").forEach(el => el.classList.remove("active"));
  document.querySelector(".greeting-box").style.display = "flex";
  history.back();
}

function updateBalance(value) {
  document.getElementById("balance").innerText = value + " บาท";

  const circle = document.getElementById("circle");

  if (value > 0) {
    circle.style.background = "linear-gradient(135deg, #00ffae, #00c6ff)";
    circle.style.boxShadow = `
      0 0 20px rgba(0,255,174,0.6),
      0 0 40px rgba(0,255,174,0.4),
      0 0 60px rgba(0,255,174,0.2)
    `;
  } 
  else if (value < 0) {
    circle.style.background = "linear-gradient(135deg, #ff5c5c, #ff0000)";
    circle.style.boxShadow = `
      0 0 20px rgba(255,0,0,0.6),
      0 0 40px rgba(255,0,0,0.4),
      0 0 60px rgba(255,0,0,0.2)
    `;
  } 
  else {
    circle.style.background = "gray";
    circle.style.boxShadow = `
      0 0 15px rgba(200,200,200,0.5)
    `;
  }
}

/* start */
loadBalanceOnly();
loadIncome();
loadExpense();

window.addEventListener("popstate", () => {
  document.querySelectorAll(".overlay").forEach(el => el.classList.remove("active"));
  document.querySelector(".greeting-box").style.display = "flex"; // 👈 เพิ่มอันนี้
});

/*สรุปยอด*/
function openSummary() {
  openOverlay("summary");
  renderSummary();
}

document.getElementById("summaryMode")?.addEventListener("change", (e) => {
  const monthBox = document.getElementById("summaryMonth");
  monthBox.style.display = e.target.value === "select" ? "block" : "none";
});

async function renderSummary() {

  let incomeMap = {};
  let expenseMap = {};

  const mode = document.getElementById("summaryMode").value;
  const selectedMonth = document.getElementById("summaryMonth").value;

  let income = 0;
  let expense = 0;

  const nowMonth = String(new Date().getMonth() + 1).padStart(2, "0");

  function checkMonth(date) {
    const m = date.split("/")[1]?.padStart(2, "0");

    if (mode === "all") return true;
    if (mode === "current") return m === nowMonth;
    if (mode === "select") return m === selectedMonth;

    return false;
  }

  // ✅ ดึงข้อมูลใหม่จาก sheet (แก้มั่ว)
  const res = await fetch(sheetURL);
  const text = await res.text();
  const rows = text.split("\n").slice(1);

  rows.forEach(row => {
    const col = row.split(",");

    const date = (col[0] || "").trim();
    const type = (col[1] || "").trim();
    const name = (col[2] || "").trim();
    const money = Number(col[3]);

    if (!money || !checkMonth(date)) return;

    if (type === "income") {
      income += money;
      incomeMap[name] = (incomeMap[name] || 0) + money;
    }

    if (type === "expense") {
      expense += money;
      expenseMap[name] = (expenseMap[name] || 0) + money;
    }
  });

  // ✅ แสดงผล
  document.getElementById("sumIncome").innerText = income.toLocaleString();
  document.getElementById("sumExpense").innerText = expense.toLocaleString();
  document.getElementById("sumBalance").innerText = (income - expense).toLocaleString();

  let percent = income > 0 ? (expense / income * 100).toFixed(0) : 0;
  document.getElementById("percentExpense").innerText = percent + "% จากรายรับทั้งหมด";

  function getTop(map) {
    let topName = "-";
    let topValue = 0;

    for (let key in map) {
      if (map[key] > topValue) {
        topValue = map[key];
        topName = key;
      }
    }

    return topValue > 0 ? `${topName} (${topValue.toLocaleString()} ฿)` : "-";
  }

  document.getElementById("topIncome").innerText = getTop(incomeMap);
  document.getElementById("topExpense").innerText = getTop(expenseMap);

  let textMsg = "";

  if (income > expense) {
    textMsg = "💸เดือนนี้เงินเข้าเยอะกว่าเงินจ่าย ทำได้ดีมาก💸";
  } else if (expense > income) {
    textMsg = "⚠️ เดือนนี้ใช้เยอะกว่ารับนะ ระวังหน่อย ⚠️";
  } else {
    textMsg = "😐 รายรับรายจ่ายเท่ากันพอดี 😐";
  }

  document.getElementById("summaryText").innerText = textMsg;
}

</script>

</body>
</html>
